<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Magic Conch Shell</title>
    <style>
      :root {
        --bg: #050505;
        --text: #f7f7f7;
        --muted: #8a8a8a;
        --dim: #5c5c5c;
        --accent: #ffffff;
        --glow: rgba(255, 255, 255, 0.06);
        --border-soft: #1f1f1f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font: 13px/1.45 "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        width: 320px;
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px;
        border-bottom: 1px solid var(--border-soft);
        background:
          radial-gradient(ellipse 120% 80% at 50% -40%, var(--glow), transparent 55%),
          linear-gradient(180deg, #0d0d0d 0%, var(--bg) 100%);
      }

      .logo {
        width: 36px;
        height: 36px;
        object-fit: cover;
        border-radius: 8px;
      }

      .brand h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      .brand p {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .body {
        padding: 16px;
      }

      .body p {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 12px;
      }

      .legend {
        margin: 0 0 14px;
        padding: 10px 12px;
        border: 1px solid var(--border-soft);
        border-radius: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .legend span {
        margin-right: 12px;
      }

      .legend .sent {
        color: #9aa0a6;
      }

      .legend .read {
        color: #1a9bfc;
        font-weight: 600;
      }

      button#refresh {
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--bg);
        background: var(--accent);
        border: none;
        border-radius: 999px;
        padding: 8px 16px;
        cursor: pointer;
        width: 100%;
      }

      button#refresh:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .footer {
        padding: 8px 16px 12px;
        border-top: 1px solid var(--border-soft);
        font-size: 10px;
        color: var(--dim);
        text-align: center;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <img class="logo" src="conch.png" width="36" height="36" alt="" />
      <div class="brand">
        <h1>The Magic Conch Shell</h1>
        <p>Gmail open tracker</p>
      </div>
    </header>

    <div class="body">
      <p>Read receipts appear in Gmail next to your sent messages — look for checkmarks in <strong>Sent</strong> and when viewing a thread.</p>
      <div class="legend">
        <span class="sent">✓ sent</span>
        <span class="read">✓✓ read</span>
      </div>
      <button type="button" id="refresh">Refresh now</button>
    </div>

    <footer class="footer" id="status">Loading…</footer>

    <script src="conch-shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
